<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>7 Days Cat-Sitting 3D (Roblox Remake)</title>
  <meta name="description" content="Three.js 3D Roblox-style 7 Days Cat-Sitting house survival & cat-rules game reproducing youtu.be/VSQXM4IS8VE." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app" aria-label="7 Days Cat-Sitting 3D">
    <!-- Full-viewport Three.js 3D suburban house stage -->
    <canvas id="game-canvas" aria-label="3D Cat-Sitting House"></canvas>

    <!-- Atmospheric VFX screen tint overlay (Ice frost, Purple Blackhole, Green Stink, Camera Flash) -->
    <div id="vfx-overlay" class="vfx-overlay" aria-hidden="true"></div>

    <!-- Subtle reticle for 3D raycast clicking -->
    <div id="reticle" class="reticle" aria-hidden="true"></div>

    <!-- Compact frosted floating top icon pill (critters-coloring-game standard) -->
    <header id="top-pill" class="floating-pill" role="toolbar" aria-label="Night and studio controls">
      <button id="btn-prev" class="icon-btn" type="button" aria-label="Previous night" title="Previous Night">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <button id="btn-progress" class="progress-capsule" type="button" aria-label="Open nights & rooms gallery" title="Nights & Rooms">
        <span id="night-dot" class="night-dot" aria-hidden="true"></span>
        <span id="night-counter" class="night-counter">N1/7</span>
        <span class="progress-track" aria-hidden="true"><span id="progress-fill" class="progress-fill"></span></span>
      </button>

      <button id="btn-next" class="icon-btn" type="button" aria-label="Next night" title="Next Night">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <button id="btn-gallery" class="icon-btn" type="button" aria-label="Rooms and nights gallery" title="Rooms & Nights">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/></svg>
      </button>

      <button id="btn-sound" class="icon-btn" type="button" aria-label="Toggle sound" aria-pressed="true" title="Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.8 5.2a9.5 9.5 0 0 1 0 13.6"/></svg>
        <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>

      <button id="btn-reset" class="icon-btn reset-btn" type="button" aria-label="Reset progress" title="Reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>

    <!-- Compact frosted floating bottom icon-only action hotbar -->
    <nav id="tool-pill" class="floating-pill" aria-label="Cat-sitting tools"></nav>

    <!-- Iconic Roblox Smartphone Overlay (Cat Owner Rules & Snapshots, sb0_00 f3/f8) -->
    <aside id="phone-overlay" class="phone-overlay hidden" role="dialog" aria-label="Cat-Sitting Phone">
      <div class="phone-bezel">
        <div class="phone-notch">
          <span class="phone-speaker"></span>
          <button id="btn-phone-close" class="phone-close" type="button" aria-label="Close phone">✕</button>
        </div>
        <div id="phone-feed" class="phone-feed"></div>
        <div class="phone-dock">
          <button id="btn-phone-snap" class="phone-snap-btn" type="button" aria-label="Take cat photo">📷</button>
        </div>
      </div>
    </aside>

    <!-- Iconic Camera Viewfinder Frame (sb0_00 f4 / f11) -->
    <div id="camera-frame" class="camera-frame hidden" aria-hidden="true">
      <span class="cam-corner tl"></span>
      <span class="cam-corner tr"></span>
      <span class="cam-corner bl"></span>
      <span class="cam-corner br"></span>
      <button id="btn-shutter" class="cam-shutter" type="button" aria-label="Snap cat photo"></button>
    </div>

    <!-- Iconic Litter Box Scoop Mini-Game Overlay (sb0_00 f13 / sb0_01 f24 / sb0_02 f19) -->
    <div id="litter-overlay" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Litter Box">
      <div class="litter-card">
        <div class="litter-head">
          <span class="litter-title">Litter Box</span>
          <span id="litter-count" class="litter-count">0/5</span>
          <button id="btn-litter-close" class="litter-close" type="button" aria-label="Close litter box">✕</button>
        </div>
        <div id="litter-tray" class="litter-tray"></div>
      </div>
    </div>

    <!-- Pure Visual Rooms, 7 Nights & 6 Fail Endings Gallery Overlay -->
    <div id="gallery-overlay" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Rooms and Nights Gallery">
      <div class="gallery-card">
        <div class="gallery-head">
          <div class="gallery-tabs" role="tablist">
            <button id="tab-nights" class="tab-btn active" type="button" role="tab" aria-selected="true">🌙 7</button>
            <button id="tab-rooms" class="tab-btn" type="button" role="tab" aria-selected="false">🏠 6</button>
            <button id="tab-endings" class="tab-btn" type="button" role="tab" aria-selected="false">💀 6</button>
          </div>
          <button id="btn-gallery-close" class="icon-btn" type="button" aria-label="Close gallery">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </div>

    <!-- Authentic Dark Roblox Ending Card (Cold as Ice / Blackhole / Evicted / Uh oh Stinky / Ancy / Fired / Victory) -->
    <div id="ending-overlay" class="ending-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ending-title">
      <div class="ending-card">
        <div id="ending-tag" class="ending-tag">FAILED</div>
        <div id="ending-emoji" class="ending-emoji" aria-hidden="true">🧊</div>
        <h2 id="ending-title" class="ending-title">Cold as Ice</h2>
        <p id="ending-sub" class="ending-sub">Badge Unlocked</p>
        <div class="ending-actions">
          <button id="btn-ending-restart" class="end-btn blue" type="button">RESTART</button>
          <button id="btn-ending-revive" class="end-btn green" type="button">REVIVE</button>
        </div>
      </div>
    </div>

    <!-- Centered dimmed-backdrop confirmation modal for destructive reset (game-ux-design-rules) -->
    <div id="reset-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title">
      <div class="confirm-modal-card">
        <div class="confirm-modal-icon" aria-hidden="true">↺</div>
        <p id="reset-modal-title" class="confirm-modal-text">Do you really want to reset ↺ all 7 nights &amp; badges?</p>
        <div class="confirm-modal-actions">
          <button id="btn-reset-no" class="modal-btn cancel" type="button">Cancel</button>
          <button id="btn-reset-yes" class="modal-btn danger" type="button">Reset</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/vendor/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
